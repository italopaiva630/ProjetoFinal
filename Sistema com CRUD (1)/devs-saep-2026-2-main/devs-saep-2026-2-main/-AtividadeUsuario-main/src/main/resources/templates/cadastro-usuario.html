<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Cadastro - Almoxarifado</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Efeito de brilho de fundo */
        .glow-bg {
            background: radial-gradient(circle at 50% -20%, rgba(59, 130, 246, 0.25), transparent 70%);
        }
        /* Efeito Glassmorphism */
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-4 relative overflow-hidden glow-bg">

<!-- Elementos decorativos sutis no fundo -->
<div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>

<div class="glass-card p-8 sm:p-10 rounded-2xl shadow-2xl w-full max-w-md relative z-10 transition-all my-8">

    <!-- Ícone & Título -->
    <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-14 h-14 bg-blue-600/20 text-blue-400 rounded-2xl mb-4 border border-blue-500/30">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
            </svg>
        </div>
        <h2 class="text-2xl font-bold tracking-tight text-white">Criar Conta</h2>
        <p class="text-sm text-slate-400 mt-1">Preencha as informações para solicitar o cadastro</p>
    </div>

    <!-- Feedback de Erro de Validação do Service -->
    <div th:if="${erro}" class="flex items-center gap-3 bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-3 rounded-xl mb-6 text-sm">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span th:text="${erro}">Erro ao realizar cadastro.</span>
    </div>

    <!-- Formulário ligado ao UsuarioDto -->
    <form id="cadastroForm" th:action="@{/salvar-usuario}" th:object="${usuario}" method="post" class="space-y-4">

        <!-- Campo Nome -->
        <div>
            <label for="nome" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Nome Completo</label>
            <div class="relative">
                <input type="text" id="nome" th:field="*{nome}" required
                       placeholder="Seu nome completo"
                       class="w-full pl-10 pr-4 py-3 bg-slate-900/60 border border-slate-700/80 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all">
                <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </span>
            </div>
        </div>

        <!-- Campo E-mail -->
        <div>
            <label for="email" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">E-mail</label>
            <div class="relative">
                <input type="email" id="email" th:field="*{email}" required
                       placeholder="seu.email@exemplo.com"
                       class="w-full pl-10 pr-4 py-3 bg-slate-900/60 border border-slate-700/80 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all">
                <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path></svg>
                </span>
            </div>
        </div>

        <!-- Campo Matrícula -->
        <div>
            <label for="matricula" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Matrícula</label>
            <div class="relative">
                <input type="text" id="matricula" th:field="*{matricula}" required
                       placeholder="Ex: MAT-001"
                       class="w-full pl-10 pr-4 py-3 bg-slate-900/60 border border-slate-700/80 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all">
                <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0"></path></svg>
                </span>
            </div>
        </div>

        <!-- Campo Data de Nascimento -->
        <div>
            <label for="dataNascimento" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Data de Nascimento (Mínimo 18 anos)</label>
            <div class="relative">
                <input type="date" id="dataNascimento" th:field="*{dataNascimento}" required
                       class="w-full pl-10 pr-4 py-3 bg-slate-900/60 border border-slate-700/80 rounded-xl text-slate-100 text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all [color-scheme:dark]">
                <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                </span>
            </div>
        </div>

        <!-- Campo Senha -->
        <div>
            <label for="senha" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Senha (Mín. 5 caract., número e símbolo)</label>
            <div class="relative">
                <input type="password" id="senha" th:field="*{senha}" required
                       placeholder="••••••••"
                       class="w-full pl-10 pr-10 py-3 bg-slate-900/60 border border-slate-700/80 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all">
                <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </span>
                <button type="button" id="toggleSenha" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 focus:outline-none">
                    <svg id="eyeIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                </button>
            </div>
        </div>

        <!-- Botão de Envio -->
        <button type="submit" id="submitBtn"
                class="w-full mt-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-medium py-3 px-4 rounded-xl shadow-lg shadow-blue-600/25 transition-all duration-200 focus:ring-2 focus:ring-blue-500/50 focus:outline-none active:scale-[0.98] flex justify-center items-center gap-2">
            <span id="btnText">Solicitar Cadastro</span>
            <svg id="btnSpinner" class="w-5 h-5 text-white animate-spin hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </button>
    </form>

    <!-- Footer / Link para Voltar -->
    <div class="text-center mt-6 text-sm text-slate-400">
        Já possui conta?
        <a th:href="@{/login}" class="text-blue-400 font-medium hover:text-blue-300 hover:underline transition-colors">Voltar para o Login</a>
    </div>

</div>

<!-- JavaScript Interativo -->
<script>
    const toggleSenha = document.getElementById('toggleSenha');
    const senhaInput = document.getElementById('senha');

    toggleSenha.addEventListener('click', () => {
        const type = senhaInput.getAttribute('type') === 'password' ? 'text' : 'password';
        senhaInput.setAttribute('type', type);
        toggleSenha.classList.toggle('text-blue-400');
    });

    const cadastroForm = document.getElementById('cadastroForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');

    cadastroForm.addEventListener('submit', () => {
        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-80', 'cursor-not-allowed');
        btnText.textContent = 'Enviando...';
        btnSpinner.classList.remove('hidden');
    });
</script>
</body>
</html>
