<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início - Almoxarifado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glow-bg { background: radial-gradient(circle at 50% -20%, rgba(59, 130, 246, 0.20), transparent 70%); }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-4 relative overflow-hidden glow-bg">

<div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>

<div class="glass-card p-8 sm:p-10 rounded-2xl shadow-2xl w-full max-w-xl text-center relative z-10">

    <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600/20 text-blue-400 rounded-2xl mb-6 border border-blue-500/30">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
    </div>

    <h1 class="text-3xl font-bold tracking-tight text-white mb-2">
        Seja bem-vindo, <span class="text-blue-400" th:text="${nomeUsuario}">Usuário</span>!
    </h1>
    <p class="text-sm text-slate-400 mb-8">O que você deseja fazer hoje no Almoxarifado?</p>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
        <a th:href="@{/produtos/novo}" class="flex flex-col items-center justify-center p-6 bg-slate-800/50 hover:bg-slate-800 border border-slate-700/50 hover:border-blue-500/50 rounded-xl transition-all group">
            <svg class="w-8 h-8 text-blue-400 mb-3 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
            <span class="font-medium text-slate-200">Novo Produto</span>
            <span class="text-xs text-slate-500 mt-1">Adicionar ao estoque</span>
        </a>

        <a th:href="@{/produtos}" class="flex flex-col items-center justify-center p-6 bg-slate-800/50 hover:bg-slate-800 border border-slate-700/50 hover:border-indigo-500/50 rounded-xl transition-all group">
            <svg class="w-8 h-8 text-indigo-400 mb-3 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path>
            </svg>
            <span class="font-medium text-slate-200">Ver Estoque</span>
            <span class="text-xs text-slate-500 mt-1">Listar itens salvos</span>
        </a>
    </div>

    <div class="pt-6 border-t border-slate-800">
        <a th:href="@{/logout}" class="inline-flex items-center justify-center w-full bg-red-500/10 border border-red-500/30 text-red-400 hover:bg-red-500/20 font-medium py-3 px-4 rounded-xl transition-all gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
            </svg>
            Sair do Sistema
        </a>
    </div>

</div>

</body>
</html>
