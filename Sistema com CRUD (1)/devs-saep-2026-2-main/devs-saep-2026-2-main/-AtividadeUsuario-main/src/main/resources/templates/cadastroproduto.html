<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produto - Almoxarifado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glow-bg { background: radial-gradient(circle at 50% -20%, rgba(59, 130, 246, 0.20), transparent 70%); }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-4 relative overflow-x-hidden glow-bg">

<div class="absolute top-0 right-0 w-[500px] h-[500px] bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute bottom-0 left-0 w-[400px] h-[400px] bg-indigo-600/10 rounded-full blur-3xl pointer-events-none"></div>

<div class="glass-card p-8 sm:p-10 rounded-2xl shadow-2xl w-full max-w-2xl relative z-10 transition-all mt-8 mb-8">

    <div class="flex items-center gap-4 mb-8 border-b border-slate-800 pb-6">
        <div class="flex-shrink-0 inline-flex items-center justify-center w-14 h-14 bg-blue-600/20 text-blue-400 rounded-2xl border border-blue-500/30">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
            </svg>
        </div>
        <div>
            <h2 class="text-2xl font-bold tracking-tight text-white" th:text="${produto.id != null} ? 'Editar Produto' : 'Cadastrar Produto'">Cadastrar Produto</h2>
            <p class="text-sm text-slate-400 mt-1">Preencha as informações do item para o inventário.</p>
        </div>
    </div>

    <div th:if="${erro}" class="flex items-start gap-3 bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-3 rounded-xl mb-6 text-sm">
        <svg class="w-5 h-5 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span th:text="${erro}">Erro ao salvar o produto.</span>
    </div>

    <div th:if="${mensagem}" class="flex items-start gap-3 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 px-4 py-3 rounded-xl mb-6 text-sm">
        <svg class="w-5 h-5 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span th:text="${mensagem}">Produto salvo com sucesso!</span>
    </div>

    <form id="produtoForm" th:action="@{/produtos/salvar}" th:object="${produto}" method="post" class="space-y-6">
        <input type="hidden" th:field="*{id}" />

        <div>
            <label for="nome" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Nome do Produto</label>
            <div class="relative">
                <input type="text" id="nome" th:field="*{nome}" required placeholder="Ex: Teclado Mecânico Keychron K2" class="w-full pl-10 pr-4 py-3 bg-slate-900/60 border border-slate-700/80 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all">
                <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg>
                </span>
            </div>
        </div>

        <div>
            <label for="descricao" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Descrição <span class="text-slate-500 font-normal lowercase">(Opcional)</span></label>
            <div class="relative">
                <textarea id="descricao" th:field="*{descricao}" rows="3" placeholder="Detalhes técnicos, especificações ou características do produto..." class="w-full pl-10 pr-4 py-3 bg-slate-900/60 border border-slate-700/80 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all resize-y"></textarea>
                <span class="absolute left-3.5 top-3.5 text-slate-500">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path></svg>
                </span>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div>
                <label for="preco" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Preço Unitário (R$)</label>
                <div class="relative">
                    <input type="number" id="preco" th:field="*{preco}" required step="0.01" min="0.01" placeholder="0,00" class="w-full pl-10 pr-4 py-3 bg-slate-900/60 border border-slate-700/80 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all">
                    <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 font-semibold text-sm">R$</span>
                </div>
            </div>

            <div>
                <label for="quantidadeEstoque" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Qtd. em Estoque</label>
                <div class="relative">
                    <input type="number" id="quantidadeEstoque" th:field="*{quantidadeEstoque}" required min="0" placeholder="Ex: 50" class="w-full pl-10 pr-4 py-3 bg-slate-900/60 border border-slate-700/80 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all">
                    <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    </span>
                </div>
            </div>
        </div>

        <div class="flex flex-col sm:flex-row items-center gap-4 pt-4 border-t border-slate-800">
            <a th:href="@{/produtos}" class="w-full sm:w-auto text-center px-6 py-3 rounded-xl text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 border border-transparent hover:border-slate-700 transition-all">
                Cancelar e Voltar
            </a>

            <button type="submit" id="submitBtn" class="w-full sm:flex-1 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-medium py-3 px-6 rounded-xl shadow-lg shadow-blue-600/25 transition-all duration-200 focus:ring-2 focus:ring-blue-500/50 focus:outline-none active:scale-[0.98] flex justify-center items-center gap-2">
                <span id="btnText" th:text="${produto.id != null} ? 'Atualizar Produto' : 'Salvar Produto'">Salvar Produto</span>
                <svg id="btnSpinner" class="w-5 h-5 text-white animate-spin hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </div>
    </form>

</div>

<script>
    const produtoForm = document.getElementById('produtoForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');

    produtoForm.addEventListener('submit', () => {
        if(produtoForm.checkValidity()) {
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-80', 'cursor-not-allowed');
            btnText.textContent = 'Processando...';
            btnSpinner.classList.remove('hidden');
        }
    });
</script>
</body>
</html>
